model:
  input_is_probability: false
  topk: 16
  hidden_dims: [32, 16]
  min_temperature: 0.05
  freeze_base: true

optimization:
  epochs: 20
  learning_rate: 0.001
  weight_decay: 0.0001
  temperature_regularization: 0.01
  bias_regularization: 0.01
  batch_size: 16
  num_workers: 0
  seed: 42

screening:
  folds: [1, 4]
  smoke_epochs: 3
  smoke_per_class: 8

acceptance:
  max_auc_drop: 0.002
  max_pd_at_5pct_pfa_drop: 0.01
  min_fixed_threshold_pfa_reduction: 0.30
  preserve_spatial_argmax: true
