model:
  name: BC-DPG-FCN-v3-scan-target-protected
  sample_feature_dim: 24
  scan_group_feature_dim: 12
  hidden_dims: [64, 32]
  maximum_shift: 3.0
  initial_background_probability: 0.05
  initial_suppression: 0.10

calibration:
  background_probability_head: sigmoid
  suppression_head: bounded_sigmoid
  formula: shift = p_background * suppression
  calibrated_logit: raw_logit - shift
  score_can_increase: false
  localization_source: frozen_raw_dpg_argmax

loss:
  allowed_target_shift: 0.10
  target_keep_weight: 8.0
  background_tail_weight: 1.0
  background_classification_weight: 1.0
  pairwise_weight: 0.20
  shift_selectivity_weight: 0.50
  shift_selectivity_margin: 0.20
  shift_regularization: 0.01

checkpoint_selection:
  pd_tolerance: 0.01
  eligible_rule: bc_validation_pd >= raw_validation_pd - 0.01
  eligible_priority:
    - minimum_pfa
    - maximum_pd
    - maximum_auc
    - minimum_loss
  ineligible_priority:
    - maximum_pd
    - minimum_pfa
    - maximum_auc
    - minimum_loss

optimization:
  epochs: 30
  batch_size: 64
  learning_rate: 0.0005
  weight_decay: 0.0001
  early_stopping_patience: 8
