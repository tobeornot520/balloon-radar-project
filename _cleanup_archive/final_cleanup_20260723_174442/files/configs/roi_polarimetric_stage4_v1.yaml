project_stage:
  name: candidate-guided-roi-polarimetric-refinement-v1
  purpose:
    - preserve the frozen Power2 detector and its range/velocity candidate
    - use only a local candidate ROI for background false-alarm suppression
    - test whether explicit H/V information adds value without scan context

base_detector:
  representation: power2
  checkpoint_pattern: results/experiments/polar_repr_v2_power2_v4_fold{fold:02d}_seed42_formal/checkpoints/best.pt
  trainable: false
  candidate_location: global maximum of frozen Power2 heatmap
  deployment_threshold: unchanged checkpoint threshold

roi:
  velocity_radius: 5
  range_radius: 4
  shape: [11, 9]
  boundary: zero_padding_with_valid_mask
  source_channels:
    - H_power
    - V_power
    - Re_H
    - Im_H
    - Re_V
    - Im_V
    - gated_relative_ZDR_like
    - gated_local_rho_HV
    - gated_cos_relative_phase
    - gated_sin_relative_phase

modes:
  power2_baseline: frozen Power2, no refiner
  power2_roi_power_control: [H_power, V_power]
  power2_roi_ri4: [Re_H, Im_H, Re_V, Im_V]
  power2_roi_polar6_gated:
    - H_power
    - V_power
    - gated_relative_ZDR_like
    - gated_local_rho_HV
    - gated_cos_relative_phase
    - gated_sin_relative_phase
  power2_roi_ri4_polar6_gated:
    - Re_H
    - Im_H
    - Re_V
    - Im_V
    - gated_relative_ZDR_like
    - gated_local_rho_HV
    - gated_cos_relative_phase
    - gated_sin_relative_phase
  canonical_channels: 8

refiner:
  inference: sample_independent
  scan_context: false
  power2_location_frozen: true
  score_operation: suppression_only
  max_suppression_logit: 8.0
  hidden_dim: 32
  new_fixed_threshold_false_alarms_possible: false

loss:
  candidate_label: target_present
  detection_bce: 1.0
  quality_bce: 0.2
  background_tail: 1.0
  target_protection: 2.0
  shift_regularization: 0.01
  tail_margin_logit: 0.25

selection:
  primary_threshold: unchanged Power2 threshold
  maximum_validation_joint_pd_drop: 0.01
  priority_after_pd_constraint:
    - lower validation Pfa
    - higher validation joint Pd
    - higher partial AUC at 5 percent FPR
    - lower validation loss
  test_set_model_selection: forbidden

first_stage:
  folds: [1, 4]
  seed: 42
  smoke_epochs: 3
  formal_epochs: 100
  smoke_role: interface_only

reporting:
  required:
    - fixed-threshold Pd and Pfa
    - ROC-AUC
    - partial AUC at 5 percent FPR
    - TPR at 1 percent FPR
    - TPR at 5 percent FPR
    - validation-to-test background score shift
    - false alarms removed and added versus Power2
    - target correct detections preserved, regressed and rescued
    - range and velocity MAE inherited from Power2

warnings:
  - relative_ZDR_like is not absolute calibrated ZDR
  - relative phase is not absolute calibrated PhiDP
  - current data are internal pre-experiment data, not an external blind test
  - suppression-only refinement cannot repair a wrong Power2 candidate location
