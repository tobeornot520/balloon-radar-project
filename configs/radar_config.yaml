radar:
  carrier_frequency_hz: 9.3e9
  prf_hz: 1450.0
  num_pulses: 128
  num_range_gates: 100
  range_resolution_m: 30.0
channels:
  names: ["H", "V"]
processing:
  slow_time_axis: 0
  range_axis: 1
  window: hanning
  clutter_suppression: demean
  fft_shift: true
  magnitude_mode: db
  epsilon: 1.0e-8
data:
  raw_dir: data/raw
  processed_dir: data/processed
output:
  figures_dir: results/figures
  tables_dir: results/tables
