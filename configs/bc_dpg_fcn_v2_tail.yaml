model:
  name: BC-DPG-FCN-v2-tail
  transform: calibrated_logits = raw_logits - softplus(shift_head(features))
  score_can_increase: false
  feature_count: 24
  topk: 16
  hidden_dims: [48, 24]
  initial_shift: 0.001

loss:
  background_margin: base_checkpoint_threshold
  positive_floor_probability: 0.80
  pairwise_margin: 1.0
  background_weight: 1.0
  positive_weight: 1.0
  pairwise_weight: 0.20
  shift_regularization: 0.01

optimization:
  epochs: 20
  batch_size: 16
  learning_rate: 0.0005
  weight_decay: 0.0001
  scheduler_patience: 3
  early_stopping_patience: 6

selection:
  primary: base_threshold_joint_pd
  secondary: negative_base_threshold_pfa
  tertiary: roc_auc
  final: negative_validation_loss
