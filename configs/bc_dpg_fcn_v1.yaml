model:
  base_output_key: fusion_logits
  gate_output_key: gate_weights
  sample_score: max_probability
  calibration_features:
    - h_mean
    - h_std
    - h_max
    - h_topk_mean
    - v_mean
    - v_std
    - v_max
    - v_topk_mean
    - gate_h
    - gate_v
    - raw_probability_max
    - raw_probability_topk_mean
  topk: 16
  hidden_dims: [32, 16]
  min_temperature: 0.05
  freeze_base: true

optimization:
  epochs: 20
  batch_size: 16
  num_workers: 0
  learning_rate: 0.001
  min_learning_rate: 0.00001
  weight_decay: 0.0001
  scheduler_patience: 3
  early_stopping_patience: 6
  gradient_clip_norm: 5.0
  temperature_regularization: 0.01
  bias_regularization: 0.01

evaluation:
  max_val_false_alarms: 2
  range_tolerance_gates: 2
  velocity_tolerance_bins: 3
  fixed_threshold: 0.5
  preserve_spatial_argmax: true

screening:
  folds: [1, 4]
  smoke_epochs: 3
  smoke_per_class: 8
  smoke_batch_size: 4
